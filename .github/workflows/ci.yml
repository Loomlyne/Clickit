name: CI

# Koss rule 4 (2026-10-20): Linux only, runs ONCE when a PR is opened, never on
# push and never on push to main. `npm run gate:local` (lint, unit, build,
# cf:build) runs on the Mac before every PR; this job repeats the parts that do
# not need the ClickitStory wrangler HOME (cf:build is local-only by design).
# To re-run after a fix, use "Re-run jobs" in the Actions tab; pushes do not
# retrigger it.

on:
  pull_request:
    types: [opened]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public values only (the anon key is a dummy): next build prerenders
      # /[locale]/legal/[slug] and needs a Supabase URL to construct a client.
      NEXT_PUBLIC_SUPABASE_URL: https://lajguozmtissnnfccmej.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
