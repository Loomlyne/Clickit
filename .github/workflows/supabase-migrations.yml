name: Supabase Migrations

# Auto-applies pending Supabase migrations to the production database whenever
# migration files change on main. Runs in parallel with the Vercel app deploy.
#
# Requires one GitHub repo secret:
#   SUPABASE_DB_URL = the production project's Session-pooler connection string
#                     (postgresql://postgres.<ref>:<password>@<region>.pooler.supabase.com:5432/postgres)
#   Set at: repo Settings -> Secrets and variables -> Actions -> New repository secret
#
# Security posture:
#   - Least-privilege GITHUB_TOKEN (read-only; this job never writes to the repo).
#   - Third-party actions pinned to a full commit SHA (a moved tag cannot inject
#     code). Version in the trailing comment; bump deliberately.
#   - Supabase CLI pinned to an exact version (no surprise from a bad `latest`).
#   - Job timeout caps a hung/abused run.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {} # allow manual run from the Actions tab

# Default the whole workflow to the minimum scope; the migrate job needs nothing
# more than reading the checked-out code.
permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: supabase/setup-cli@fe52e8551e5e65c2c6a20121b1c0998d6c5e3e1f # v1.4.0
        with:
          version: 2.102.0

      - name: Apply pending migrations
        # --include-all: apply every pending local migration even when its version
        # sorts before the latest one already on remote. Without it, db push aborts
        # (exit 1) the moment a migration with an out-of-order timestamp appears —
        # which happens whenever migrations are authored in parallel branches/sessions
        # and merged with interleaved timestamps. Every committed migration here is
        # meant for prod, so applying all pending is the intended behaviour.
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
