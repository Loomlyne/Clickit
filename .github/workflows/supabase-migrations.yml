name: Apply Reviewed Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Reviewed 40-character commit SHA already merged to main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify reviewed main commit
        env:
          REVIEWED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'sha must be a lowercase 40-character commit SHA'
            exit 1
          fi

          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$REVIEWED_SHA" ]; then
            echo 'checked out commit does not match the reviewed SHA'
            exit 1
          fi

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REVIEWED_SHA" origin/main

      - uses: supabase/setup-cli@fe52e8551e5e65c2c6a20121b1c0998d6c5e3e1f # v1.4.0
        with:
          version: 2.102.0

      - name: Apply pending migrations
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
