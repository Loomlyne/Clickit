name: Diag Migrations (read-only)

# TEMPORARY read-only diagnostic. Lists local-vs-remote migration state so we can
# untangle the duplicate-version history without writing to prod. Dispatch-only;
# never runs on push. Safe to delete once the migration history is reconciled.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: supabase/setup-cli@fe52e8551e5e65c2c6a20121b1c0998d6c5e3e1f # v1.4.0
        with:
          version: 2.102.0

      - name: List migrations (read-only)
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
